name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/test/*.test.js
      - name: Deploy the helper to Cloudflare
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare token yet; skipping."; exit 0; fi
          npx --yes wrangler@4 deploy | tee deploy.log
          if [ -n "$QLOO_API_KEY" ]; then printf '%s' "$QLOO_API_KEY" | npx --yes wrangler@4 secret put QLOO_API_KEY; fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Helper: $url"

  pages:
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the helper
        env:
          API: ${{ needs.worker.outputs.url || vars.WORKER_URL }}
        run: echo "window.RR_API = '${API}';" > web/config.js && cat web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: [worker, pages]
    if: needs.worker.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs "${{ needs.worker.outputs.url }}"
